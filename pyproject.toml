[project]
name = "lernakademie"
version = "0.1.0"
description = "LangChain & LangGraph Lernakademie – geführter Einstieg in KI-Anwendungen mit Python (Stufen 0–4)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-mistralai>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-community>=0.4,<1.0",
  "langgraph>=1.0,<2.0",
  "mistralai>=3.0,<4.0",
  "pydantic>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.0,<14.0",
  "neo4j>=5.0,<6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "streamlit>=1.35",
  "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["lernakademie/tests", "tests"]
addopts = "-q"
