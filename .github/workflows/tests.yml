name: Tests & Qualitaetspruefung

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      # Alle Tests laufen bewusst im OFFLINE-Modus: keine API-Calls,
      # keine Kosten, keine Geheimnisse in CI.
      - name: Tests ausfuehren (offline, inkl. Notebook-Validierung)
        env:
          ACADEMY_OFFLINE: "1"
        run: |
          pytest
          pytest "final-project/knowledge-research-agent/tests"

      - name: Statische Pruefung (ruff)
        run: ruff check --select F401,F811,F821 .

      - name: Import-Check
        env:
          ACADEMY_OFFLINE: "1"
        run: python -c "import lernakademie; from lernakademie.llm_client import get_chat_model; get_chat_model()"
