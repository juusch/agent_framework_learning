name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Alle Tests laufen bewusst im OFFLINE-Modus: keine API-Calls,
      # keine Kosten, keine Geheimnisse in CI.
      - name: Tests ausfuehren (offline)
        env:
          ACADEMY_OFFLINE: "1"
        run: pytest
